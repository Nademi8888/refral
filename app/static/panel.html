<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>پنل RaGNaR GEM</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#121823;--panel-2:#182130;--line:rgba(140,170,210,.14);
--ink:#e9eff8;--muted:#8395ad;--dim:#5a6a80;--accent:#38d6ff;--ok:#33d68a;--bad:#ff5f78;--warn:#ffc04d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;
 background-image:radial-gradient(900px 400px at 85% -10%,rgba(56,214,255,.08),transparent 60%)}
code,.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
header h1{font-size:1.15rem;font-weight:700}
.chip{margin-inline-start:auto;font-size:.8rem;border:1px solid var(--line);border-radius:999px;
 padding:5px 13px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:.83rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}
h2{font-size:1rem;margin-bottom:4px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.kv div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.kv div:last-child{border-bottom:0}.kv span:first-child{color:var(--muted);min-width:140px}
label{display:block;font-size:.86rem;margin-bottom:7px}
input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
 font-family:inherit;padding:10px 12px;font-size:.9rem;direction:ltr;text-align:left}
input:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.btn{border:0;border-radius:9px;font-family:inherit;font-size:.9rem;padding:10px 18px;cursor:pointer}
.btn-main{background:var(--accent);color:#04202c}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(140,170,210,.28)}
.row{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.msg{font-size:.84rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>پنل RaGNaR GEM</h1>
    <div class="chip"><i class="dot" id="dot"></i><span id="state">…</span></div>
  </header>

  <div class="cards" id="stats"></div>

  <div class="card">
    <h2>وضعیت سرویس</h2>
    <p class="sub">اطلاعات اتصال ربات و دیتابیس</p>
    <div class="kv" id="info"></div>
    <div class="row">
      <button class="btn btn-ghost" id="restart">ری‌استارت ربات</button>
      <span class="msg" id="rmsg"></span>
    </div>
  </div>

  <div class="card">
    <h2>تنظیمات</h2>
    <p class="sub">تغییرات بلافاصله اعمال می‌شود؛ تغییر توکن ربات را ری‌استارت می‌کند.</p>
    <div class="field"><label for="bot_token">توکن ربات</label><input id="bot_token"></div>
    <div class="grid2">
      <div class="field"><label for="admin_id">آیدی ادمین</label><input id="admin_id"></div>
      <div class="field"><label for="withdrawal_channel">کانال برداشت</label><input id="withdrawal_channel"></div>
      <div class="field"><label for="channel_2">کانال دوم</label><input id="channel_2"></div>
      <div class="field"><label for="channel_3">کانال سوم</label><input id="channel_3"></div>
      <div class="field"><label for="channel_4">کانال چهارم</label><input id="channel_4"></div>
      <div class="field"><label for="referrals_required">رفرال لازم</label><input id="referrals_required"></div>
      <div class="field"><label for="gems_per_withdrawal">جم هر برداشت</label><input id="gems_per_withdrawal"></div>
    </div>
    <div class="row">
      <button class="btn btn-main" id="save">ذخیره تغییرات</button>
      <span class="msg" id="smsg"></span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get('key') || '';
const FIELDS = ['bot_token','admin_id','withdrawal_channel','channel_2','channel_3','channel_4',
                'referrals_required','gems_per_withdrawal'];

async function load(){
  const data = await (await fetch('/api/status?key=' + encodeURIComponent(KEY))).json();
  if (!data.ok){ document.body.innerHTML = '<div class="wrap"><div class="card">کلید دسترسی نامعتبر است.</div></div>'; return; }
  $('dot').className = 'dot ' + (data.bot.status === 'running' ? 'ok' : 'bad');
  $('state').textContent = data.bot.status === 'running' ? 'ربات فعال' : (data.bot.error || 'متوقف');
  const s = data.stats;
  $('stats').innerHTML = [
    ['کاربران', s.users], ['رفرال فعال', s.referrals],
    ['در انتظار', s.pending], ['پرداخت‌شده', s.paid], ['مجموع جم', s.gems]
  ].map(([t,v]) => `<div class="stat"><b>${v}</b><span>${t}</span></div>`).join('');
  $('info').innerHTML = `
    <div><span>ربات</span><b class="mono">@${data.bot.username || '—'}</b></div>
    <div><span>دیتابیس</span><b>${data.database}</b></div>
    <div><span>کانال اجباری</span><b class="mono">${data.mandatory_channel}</b></div>
    <div><span>نسخه</span><b>${data.version}</b></div>`;
  FIELDS.forEach(f => { if (data.settings[f] !== undefined) $(f).value = data.settings[f]; });
}

$('save').onclick = async () => {
  const body = {key: KEY};
  FIELDS.forEach(f => body[f] = $(f).value.trim());
  $('smsg').textContent = 'در حال ذخیره…';
  const res = await (await fetch('/api/settings', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})).json();
  $('smsg').textContent = res.ok ? 'ذخیره شد.' : res.error;
  if (res.ok) load();
};

$('restart').onclick = async () => {
  $('rmsg').textContent = 'در حال ری‌استارت…';
  const res = await (await fetch('/api/restart', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({key: KEY})})).json();
  $('rmsg').textContent = res.ok ? 'انجام شد.' : res.error;
  load();
};

load();
setInterval(load, 15000);
</script>
</body>
</html>
